# Builds and tests every push to main and every pull request, and packages a test installer
# and portable exe. The release workflow also calls this, so nothing ships without passing it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Readdit.csproj -c Release -p:TreatWarningsAsErrors=true

      - name: Post view smoke test
        shell: pwsh
        run: ./tests/run-smoke.ps1

      # A throwaway prerelease version so every CI build produces installable artifacts.
      - name: CI version
        shell: pwsh
        run: |
          $base = dotnet msbuild Readdit.csproj -getProperty:Version
          echo "VERSION=$base-ci.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Package installer and portable exe
        shell: pwsh
        run: ./build-installer.ps1 -Version ${{ env.VERSION }}

      - uses: actions/upload-artifact@v7
        with:
          name: Readdit-${{ env.VERSION }}
          path: |
            Releases/Readdit-win-Setup.exe
            Releases/Readdit-Portable.exe
          retention-days: 14
