# Builds and tests the app: every pull request, and (through the Release workflow) every push to
# main. Pull requests also get a test installer and portable exe as artifacts.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: 'Also build the installer and portable exe as artifacts'
        type: boolean
        default: true

# Newer pushes to a pull request cancel older CI runs; runs called by Release are never cancelled
# from here (Release manages its own concurrency).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Readdit.csproj -c Release -p:TreatWarningsAsErrors=true

      - name: Unit tests
        run: dotnet test tests/Readdit.Tests/Readdit.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Post view smoke test
        shell: pwsh
        run: ./tests/run-smoke.ps1

      # A throwaway prerelease version so each CI build produces installable artifacts.
      - name: CI version
        if: ${{ inputs.package != false }}
        shell: pwsh
        run: |
          $base = dotnet msbuild Readdit.csproj -getProperty:Version
          echo "VERSION=$base-ci.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Package installer and portable exe
        if: ${{ inputs.package != false }}
        shell: pwsh
        run: ./build-installer.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.package != false }}
        with:
          name: Readdit-${{ env.VERSION }}
          path: |
            Releases/Readdit-win-Setup.exe
            Releases/Readdit-Portable.exe
          retention-days: 14
