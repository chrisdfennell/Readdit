# Publishes a GitHub release with the installer and portable exe. Installed copies of Readdit
# update from these. Start it by pushing a version tag (git tag v1.2.3 && git push origin v1.2.3),
# or from the Actions tab with "Run workflow" and a version number.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.5.0)'
        required: true

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { $env:GITHUB_REF_NAME }
          $version = $version.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([-+].+)?$') { throw "'$version' isn't a version like 1.2.3" }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore tools
        run: dotnet tool restore

      # Previous releases let vpk build small delta updates.
      - name: Download previous releases
        run: dotnet vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases
        continue-on-error: true

      - name: Build installer and portable exe
        shell: pwsh
        run: ./build-installer.ps1 -Version ${{ env.VERSION }}

      - name: Publish release
        run: >
          dotnet vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases --publish
          --releaseName "Readdit ${{ env.VERSION }}" --tag v${{ env.VERSION }}

      - name: Attach portable exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ env.VERSION }} Releases/Readdit-Portable.exe --clobber
