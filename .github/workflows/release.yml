# Publishes a GitHub release with the installer and portable exe; installed and portable copies
# of Readdit update from these.
#
# Automatic: every push to main (except docs-only changes) runs CI and, if it passes, releases
# the next patch version. Put [skip release] in the commit message to skip one.
# Manual: Actions → Release → Run workflow for a minor/major bump or an exact version,
# or push a tag yourself: git tag v1.2.3 && git push origin v1.2.3
# The version comes from the latest v* tag (the first release uses the one in Readdit.csproj).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Or an exact version (e.g. 1.0.0); overrides the bump'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Decide version
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need tags

      - id: v
        shell: pwsh
        run: |
          $bump = if ('${{ inputs.bump }}') { '${{ inputs.bump }}' } else { 'patch' }   # pushes to main bump the patch
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ('${{ inputs.version }}') {
            $version = '${{ inputs.version }}'.TrimStart('v')
          } else {
            $last = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            if (-not $last) {
              # First release: use the version the project already declares.
              $version = ([xml](Get-Content Readdit.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            } else {
              $parts = $last.TrimStart('v').Split('.') | ForEach-Object { [int]$_ }
              switch ($bump) {
                'major' { $version = "$($parts[0] + 1).0.0" }
                'minor' { $version = "$($parts[0]).$($parts[1] + 1).0" }
                default { $version = "$($parts[0]).$($parts[1]).$($parts[2] + 1)" }
              }
            }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-+].+)?$') { throw "'$version' isn't a version like 1.2.3" }
          if ('${{ github.ref_type }}' -ne 'tag' -and (git tag --list "v$version")) { throw "v$version already exists" }
          Write-Host "Releasing $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: [version, ci]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Unless a tag started this run, create it. (Pushes made with GITHUB_TOKEN don't start new runs.)
      - name: Tag
        if: github.ref_type != 'tag'
        run: |
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}

      - name: Restore tools
        run: dotnet tool restore

      # Previous releases let vpk build small delta updates.
      - name: Download previous releases
        run: dotnet vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases
        continue-on-error: true

      - name: Build installer and portable exe
        shell: pwsh
        run: ./build-installer.ps1 -Version ${{ env.VERSION }}

      - name: Publish release
        run: >
          dotnet vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --outputDir Releases --publish
          --releaseName "Readdit ${{ env.VERSION }}" --tag v${{ env.VERSION }}

      - name: Attach portable exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ env.VERSION }} Releases/Readdit-Portable.exe --clobber
