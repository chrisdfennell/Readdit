<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://cdn.jsdelivr.net;
                   style-src 'self' 'unsafe-inline';
                   img-src https: data: blob:;
                   media-src https: blob:;
                   connect-src https:;
                   worker-src blob:;
                   frame-src https://www.youtube-nocookie.com;">
    <title>Readdit</title>
    <link rel="stylesheet" href="detail.css">
    <!-- hls.js plays Reddit's HLS video streams (with sound) via Media Source Extensions. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
    <!-- marked renders the live Markdown preview while writing replies and edits. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
    <script src="detail.js" defer></script>
</head>
<body>
    <div id="empty">
        <div class="empty-mark">◉</div>
        <p>Select a post to read it here.</p>
        <p class="muted">j / k to move · a / z to vote · ? for all shortcuts</p>
    </div>
    <main id="root"></main>

    <div id="lightbox" hidden>
        <button class="lb-close" title="Close (Esc)">✕</button>
        <button class="lb-nav lb-prev" title="Previous (←)">‹</button>
        <div class="lb-stage"><img alt=""></div>
        <button class="lb-nav lb-next" title="Next (→)">›</button>
        <div class="lb-counter"></div>
    </div>

    <div id="toast" hidden></div>
</body>
</html>
